<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson Progress | Flexi Lessons</title><link rel="stylesheet" href="assets.css"></head><body>

    <header><div class="head"><div class="brand">Flexi Lessons <small>Guiding students to Academic success</small></div>
    <nav>
      <a href="dashboard.html">Dashboard</a><a href="classes.html">My Classes</a><a href="progress.html">Progress</a>
      <a href="cbt-scores.html">CBT Scores</a><a href="attendance.html">Attendance</a><a href="subscription.html">Subscription</a><a href="profile.html">Profile</a>
    </nav></div></header><main>
<section class="card"><h1>Lesson Progress</h1><p class="muted">Record completed lessons and track your personal progress.</p><div id="message" class="notice hidden"></div>
<form id="progressForm"><div class="grid"><div><label>Subject / class</label><input id="subject" required></div><div><label>Lesson title</label><input id="lesson" required></div><div><label>Status</label><select id="status"><option>Completed</option><option>In progress</option><option>Not started</option></select></div></div><label>Notes (optional)</label><textarea id="notes"></textarea><div class="actions"><button>Save progress</button></div></form></section>
<section class="card"><h2>Progress records</h2><div id="records" class="tablewrap">Loading…</div></section>
</main><footer>Flexi Educational Consult · Student Portal</footer>
<script type="module">
import {auth,onAuthStateChanged,signOut,db,doc,getDoc} from './firebase.js';
const msg=document.getElementById('message');
function notice(t,err=false){if(!msg)return;msg.textContent=t;msg.classList.remove('hidden','error','success');msg.classList.add(err?'error':'success')}
onAuthStateChanged(auth,async user=>{if(!user){location.replace('login.html');return}window.flexiUser=user;const label=document.getElementById('userLabel');if(label)label.textContent=user.displayName||user.email;document.querySelectorAll('[data-logout]').forEach(b=>b.addEventListener('click',async()=>{await signOut(auth);location.href='login.html'}));document.dispatchEvent(new CustomEvent('flexi-ready',{detail:{user,db,doc,getDoc}}));});
</script><script type="module">
import {auth,db,collection,addDoc,getDocs,query,where,serverTimestamp} from './firebase.js';
const $=id=>document.getElementById(id);let user;
function msg(t,err=false){let e=$('message');e.textContent=t;e.classList.remove('hidden','error','success');e.classList.add(err?'error':'success')}
document.addEventListener('flexi-ready',async e=>{user=e.detail.user;await load()});
async function load(){const s=await getDocs(query(collection(db,'lessonProgress'),where('uid','==',user.uid)));let rows=[];s.forEach(d=>rows.push(d.data()));let done=rows.filter(x=>x.status==='Completed').length, pct=rows.length?Math.round(done/rows.length*100):0;$('records').innerHTML=`<p><strong>${done}/${rows.length}</strong> lessons completed (${pct}%)</p><div class="bar"><span style="width:${pct}%"></span></div><table><thead><tr><th>Subject</th><th>Lesson</th><th>Status</th><th>Notes</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.subject)}</td><td>${esc(x.lesson)}</td><td>${esc(x.status)}</td><td>${esc(x.notes||'')}</td></tr>`).join('')}</tbody></table>`}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('progressForm').addEventListener('submit',async e=>{e.preventDefault();try{await addDoc(collection(db,'lessonProgress'),{uid:user.uid,subject:$('subject').value.trim(),lesson:$('lesson').value.trim(),status:$('status').value,notes:$('notes').value.trim(),updatedAt:serverTimestamp()});e.target.reset();msg('Progress saved.');load()}catch(err){msg(err.message,true)}});
</script></body></html>
