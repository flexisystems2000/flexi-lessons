<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Classes | Flexi Lessons</title><link rel="stylesheet" href="assets.css"></head><body>

    <header><div class="head"><div class="brand">Flexi Lessons <small>Guiding students to Academic success</small></div>
    <nav>
      <a href="dashboard.html">Dashboard</a><a href="classes.html">My Classes</a><a href="progress.html">Progress</a>
      <a href="cbt-scores.html">CBT Scores</a><a href="attendance.html">Attendance</a><a href="subscription.html">Subscription</a><a href="profile.html">Profile</a>
    </nav></div></header><main>
<section class="card"><h1>My Classes</h1><p class="muted">Add the classes you are attending. These records are saved to your own Firestore account.</p><div id="message" class="notice hidden"></div>
<form id="classForm"><div class="grid"><div><label>Class / subject</label><input id="className" required placeholder="e.g. JAMB Mathematics"></div><div><label>Tutor / group (optional)</label><input id="tutor" placeholder="Tutor or WhatsApp group"></div></div><label>Notes (optional)</label><input id="notes"><div class="actions"><button>Add class</button></div></form></section>
<section class="card"><h2>Your classes</h2><div id="classList" class="grid"><p class="muted">Loading…</p></div></section>
</main><footer>Flexi Educational Consult · Student Portal</footer>
<script type="module">
import {auth,onAuthStateChanged,signOut,db,doc,getDoc} from './firebase.js';
const msg=document.getElementById('message');
function notice(t,err=false){if(!msg)return;msg.textContent=t;msg.classList.remove('hidden','error','success');msg.classList.add(err?'error':'success')}
onAuthStateChanged(auth,async user=>{if(!user){location.replace('login.html');return}window.flexiUser=user;const label=document.getElementById('userLabel');if(label)label.textContent=user.displayName||user.email;document.querySelectorAll('[data-logout]').forEach(b=>b.addEventListener('click',async()=>{await signOut(auth);location.href='login.html'}));document.dispatchEvent(new CustomEvent('flexi-ready',{detail:{user,db,doc,getDoc}}));});
</script><script type="module">
import {auth,db,collection,addDoc,getDocs,query,where,serverTimestamp,deleteDoc,doc} from './firebase.js';
const $=id=>document.getElementById(id);let user;
function msg(t,err=false){const e=$('message');e.textContent=t;e.classList.remove('hidden','error','success');e.classList.add(err?'error':'success')}
document.addEventListener('flexi-ready',async e=>{user=e.detail.user;await load()});
async function load(){const box=$('classList');box.innerHTML='';const snap=await getDocs(query(collection(db,'studentClasses'),where('uid','==',user.uid)));if(snap.empty){box.innerHTML='<p class="muted">No classes added yet.</p>';return}snap.forEach(d=>{const x=d.data(),el=document.createElement('article');el.className='card';el.innerHTML=`<h2></h2><p class="muted"></p><p></p><button class="danger">Remove</button>`;el.querySelector('h2').textContent=x.className||'Class';el.querySelectorAll('p')[0].textContent=x.tutor||'Tutor not added';el.querySelectorAll('p')[1].textContent=x.notes||'';el.querySelector('button').onclick=async()=>{await deleteDoc(doc(db,'studentClasses',d.id));load()};box.appendChild(el)})}
$('classForm').addEventListener('submit',async e=>{e.preventDefault();if(!user)return;try{await addDoc(collection(db,'studentClasses'),{uid:user.uid,className:$('className').value.trim(),tutor:$('tutor').value.trim(),notes:$('notes').value.trim(),createdAt:serverTimestamp()});e.target.reset();msg('Class saved.');await load()}catch(err){msg(err.message,true)}});
</script></body></html>
