<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance | Flexi Lessons</title><link rel="stylesheet" href="assets.css"></head><body>

    <header><div class="head"><div class="brand">Flexi Lessons <small>Guiding students to Academic success</small></div>
    <nav>
      <a href="dashboard.html">Dashboard</a><a href="classes.html">My Classes</a><a href="progress.html">Progress</a>
      <a href="cbt-scores.html">CBT Scores</a><a href="attendance.html">Attendance</a><a href="subscription.html">Subscription</a><a href="profile.html">Profile</a>
    </nav></div></header><main>
<section class="card"><h1>Attendance</h1><p class="muted">Keep your attendance record for online or physical lessons.</p><div id="message" class="notice hidden"></div>
<form id="attendanceForm"><div class="grid"><div><label>Date</label><input id="date" type="date" required></div><div><label>Class / subject</label><input id="className" required></div><div><label>Status</label><select id="status"><option>Present</option><option>Absent</option><option>Late</option></select></div></div><label>Notes (optional)</label><input id="notes"><div class="actions"><button>Save attendance</button></div></form></section>
<section class="card"><h2>Attendance history</h2><div id="records" class="tablewrap">Loading…</div></section>
</main><footer>Flexi Educational Consult · Student Portal</footer>
<script type="module">
import {auth,onAuthStateChanged,signOut,db,doc,getDoc} from './firebase.js';
const msg=document.getElementById('message');
function notice(t,err=false){if(!msg)return;msg.textContent=t;msg.classList.remove('hidden','error','success');msg.classList.add(err?'error':'success')}
onAuthStateChanged(auth,async user=>{if(!user){location.replace('login.html');return}window.flexiUser=user;const label=document.getElementById('userLabel');if(label)label.textContent=user.displayName||user.email;document.querySelectorAll('[data-logout]').forEach(b=>b.addEventListener('click',async()=>{await signOut(auth);location.href='login.html'}));document.dispatchEvent(new CustomEvent('flexi-ready',{detail:{user,db,doc,getDoc}}));});
</script><script type="module">
import {auth,db,collection,addDoc,getDocs,query,where,serverTimestamp} from './firebase.js';const $=id=>document.getElementById(id);let user;
function msg(t,err=false){let e=$('message');e.textContent=t;e.classList.remove('hidden','error','success');e.classList.add(err?'error':'success')}
document.addEventListener('flexi-ready',async e=>{user=e.detail.user;$('date').value=new Date().toISOString().slice(0,10);await load()});
async function load(){const s=await getDocs(query(collection(db,'attendance'),where('uid','==',user.uid)));let rows=[];s.forEach(d=>rows.push(d.data()));rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('records').innerHTML=`<table><thead><tr><th>Date</th><th>Class</th><th>Status</th><th>Notes</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.className)}</td><td>${esc(x.status)}</td><td>${esc(x.notes||'')}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<p class="muted">No attendance recorded yet.</p>'}`}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('attendanceForm').addEventListener('submit',async e=>{e.preventDefault();try{await addDoc(collection(db,'attendance'),{uid:user.uid,date:$('date').value,className:$('className').value.trim(),status:$('status').value,notes:$('notes').value.trim(),createdAt:serverTimestamp()});e.target.reset();$('date').value=new Date().toISOString().slice(0,10);msg('Attendance saved.');load()}catch(err){msg(err.message,true)}});
</script></body></html>
