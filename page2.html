<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registration | Flexi Lessons</title><link rel="stylesheet" href="assets.css"></head><body>
<main>
<section class="card"><h1>Student Registration</h1><p>This compatibility page saves your details locally and then sends you to the portal account page. Create an account with an email and password to enable cloud syncing.</p>
<form id="reg"><label>Full name</label><input id="name" required><label>Date of birth</label><input id="dob" type="date"><label>Phone number</label><input id="phone" type="tel"><label>Email address</label><input id="email" type="email" required><label>Parent / guardian name</label><input id="parent"><label>Parent / guardian phone</label><input id="parentPhone" type="tel"><label>Exam type</label><select id="exam"><option>JAMB UTME</option><option>WAEC</option><option>NECO</option><option>Other</option></select><label>Subjects</label><textarea id="subjects" placeholder="Separate subjects with commas"></textarea><div class="actions"><button>Continue</button></div></form></section>
</main><footer>Flexi Educational Consult · Student Portal</footer><script>document.getElementById('reg').addEventListener('submit',e=>{e.preventDefault();const v=id=>document.getElementById(id).value;const data={name:v('name'),dob:v('dob'),phone:v('phone'),email:v('email'),parent:v('parent'),parentPhone:v('parentPhone'),exam:v('exam'),subjects:v('subjects')};localStorage.setItem('flexiStudentRegistration',JSON.stringify(data));location.href='login.html'})</script></body></html>
