<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile | Flexi Lessons</title><link rel="stylesheet" href="assets.css"></head><body>

    <header><div class="head"><div class="brand">Flexi Lessons <small>Guiding students to Academic success</small></div>
    <nav>
      <a href="dashboard.html">Dashboard</a><a href="classes.html">My Classes</a><a href="progress.html">Progress</a>
      <a href="cbt-scores.html">CBT Scores</a><a href="attendance.html">Attendance</a><a href="subscription.html">Subscription</a><a href="profile.html">Profile</a>
    </nav></div></header><main>
<section class="card"><h1>My Profile</h1><div id="message" class="notice hidden"></div>
<div class="grid"><div><img id="avatar" class="avatar" alt="Profile picture"><p class="muted small">Profile image is resized in your browser and saved as Base64 in Firestore. Firebase Storage is not used.</p><label for="photo">Choose profile picture</label><input id="photo" type="file" accept="image/*"></div>
<div><form id="profileForm"><label>Full name</label><input id="name" required><label>Email</label><input id="email" type="email" disabled><label>Phone</label><input id="phone" type="tel"><label>School</label><input id="school"><label>Exam type</label><select id="examType"><option value="">Select</option><option>JAMB UTME</option><option>WAEC</option><option>NECO</option><option>Other</option></select><label>About me (optional)</label><textarea id="bio"></textarea><div class="actions"><button>Save profile</button></div></form></div></div></section>
</main><footer>Flexi Educational Consult · Student Portal</footer>
<script type="module">
import {auth,onAuthStateChanged,signOut,db,doc,getDoc} from './firebase.js';
const msg=document.getElementById('message');
function notice(t,err=false){if(!msg)return;msg.textContent=t;msg.classList.remove('hidden','error','success');msg.classList.add(err?'error':'success')}
onAuthStateChanged(auth,async user=>{if(!user){location.replace('login.html');return}window.flexiUser=user;const label=document.getElementById('userLabel');if(label)label.textContent=user.displayName||user.email;document.querySelectorAll('[data-logout]').forEach(b=>b.addEventListener('click',async()=>{await signOut(auth);location.href='login.html'}));document.dispatchEvent(new CustomEvent('flexi-ready',{detail:{user,db,doc,getDoc}}));});
</script><script type="module">
import {auth,db,doc,getDoc,setDoc,updateProfile,serverTimestamp} from './firebase.js';const $=id=>document.getElementById(id);let user,photoBase64='';
function msg(t,err=false){let e=$('message');e.textContent=t;e.classList.remove('hidden','error','success');e.classList.add(err?'error':'success')}
document.addEventListener('flexi-ready',async e=>{user=e.detail.user;$('email').value=user.email||'';$('name').value=user.displayName||'';const snap=await getDoc(doc(db,'studentProfiles',user.uid));if(snap.exists()){const d=snap.data();$('name').value=d.name||user.displayName||'';$('phone').value=d.phone||'';$('school').value=d.school||'';$('examType').value=d.examType||'';$('bio').value=d.bio||'';photoBase64=d.photoBase64||''}showPhoto()});
$('photo').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){msg('Choose an image file.',true);return}try{photoBase64=await resizeToBase64(f);if(photoBase64.length>450*1024)throw Error('Image is still too large after resizing. Choose a smaller image.');showPhoto();msg('Picture prepared. Save profile to keep it.')}catch(err){photoBase64='';msg(err.message,true)}});
function resizeToBase64(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=256,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.72))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Could not read image.'))};img.src=url})}
function showPhoto(){$('avatar').src=photoBase64||'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" fill="#e8edf4"/><circle cx="50" cy="37" r="18" fill="#9aa8bb"/><path d="M15 100c3-24 16-34 35-34s32 10 35 34" fill="#9aa8bb"/></svg>')}
$('profileForm').addEventListener('submit',async e=>{e.preventDefault();try{const data={uid:user.uid,name:$('name').value.trim(),email:user.email||'',phone:$('phone').value.trim(),school:$('school').value.trim(),examType:$('examType').value,bio:$('bio').value.trim(),photoBase64,updatedAt:serverTimestamp()};if(photoBase64.length>450*1024)throw Error('Profile image is too large.');await setDoc(doc(db,'studentProfiles',user.uid),data,{merge:true});await updateProfile(user,{displayName:data.name});msg('Profile saved successfully.')}catch(err){msg(err.message,true)}});
</script></body></html>
